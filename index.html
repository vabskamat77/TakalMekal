<!doctype html><html lang="kok-Deva"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तकल मेकल</title><link rel="stylesheet" href="css/style.css?v=3.0"><style>.grid button .round-status{display:table;margin:.35rem auto 0;padding:.2rem .7rem;border-radius:999px;font-size:.8rem;font-weight:700;line-height:1.2;background:#334155;color:#fff}.grid button .round-status[data-status="completed"]{background:#14532d;color:#dcfce7}#menu button[data-round]:disabled{opacity:1;filter:none;cursor:default}#menu button[data-round]:disabled .round-status{opacity:1}.grid button .round-status[hidden]{display:table;visibility:hidden}.grid button .round-status[hidden]::before{content:"✓ Completed"}#view .question-tile{position:relative;display:grid;grid-template-rows:auto 1fr;min-height:clamp(240px,42vh,520px);padding:16px;gap:12px}#view:has(.question-tile){background:transparent;padding:0;margin-top:clamp(12px,2.5vh,28px)}#view .question-tile{background:#1e2947;border-radius:20px}#view .question-meta{min-height:110px;padding-inline:clamp(100px,18vw,160px);text-align:center}#view .question-meta h3{font-size:clamp(1.4rem,3vw,2.5rem)}#view .question-meta p{font-size:clamp(.85rem,1.5vw,1.1rem)}#view .question-meta h3,#view .question-meta p{margin:4px 0;overflow-wrap:anywhere}#view .question-timer{position:absolute;top:16px;right:16px;text-align:center}#view .question-tile .timer{font-size:clamp(1.6rem,4vw,3rem);line-height:1.2;background:#10152e;border-radius:12px;padding:8px 12px}#view .question-text{display:grid;place-items:center;text-align:center;font-size:clamp(1.6rem,4vw,3.5rem);line-height:1.5;overflow-wrap:anywhere;margin:0;padding:12px}#view .round-caption{margin:0 0 10px;text-align:center;font-size:clamp(1.2rem,2.8vw,2.2rem);color:#cbd5e1;font-weight:800}@media(max-width:600px){#view .question-meta{padding-inline:0;padding-top:90px}}#view .question-tile .timer.expired{color:#f87171}#view .time-over{color:#f87171;font-size:clamp(.85rem,2vw,1.3rem);font-weight:800;line-height:1.3;margin-top:4px}#view .time-over[hidden]{display:block;visibility:hidden}#view .round-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 10px}#view .round-heading .round-caption{margin:0;text-align:left;min-width:0;overflow-wrap:anywhere}#view .team-caption{margin:0;text-align:right;font-size:clamp(1.2rem,2.8vw,2.2rem);font-weight:800;min-width:0;overflow-wrap:anywhere}#view .question-tile{grid-template-rows:1fr;padding-top:clamp(90px,14vh,130px);box-sizing:border-box}#view .question-tile.no-timer{padding-top:16px}#view .round-heading{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}#view .round-heading .team-caption{text-align:center;box-sizing:border-box;padding-left:40%}#view .round-heading .team-caption{grid-column:2}#quiz-subtitle[hidden]{display:none!important}#view .question-tile{grid-template-rows:auto 1fr;padding-top:16px}#view .question-tile .team-caption{text-align:left;padding-left:0;padding-right:clamp(100px,18vw,180px);min-height:clamp(74px,12vh,114px);margin:0;box-sizing:border-box}#view .question-tile.no-timer .team-caption{padding-inline:0;min-height:0}@media(max-width:600px){#view .question-tile:not(.no-timer) .team-caption{padding:0 110px 0 0;min-height:90px}}#view .question-tile > h3.team-caption{display:block!important;position:static!important;justify-self:stretch!important;align-self:start!important;width:100%!important;text-align:left!important;margin:0!important;transform:none!important;padding-left:0!important}main:has(#quiz-subtitle[hidden]) #main-title{scale:1;font-size:clamp(1.5rem,4.5vw,3.5rem)}@media(max-width:600px){main:has(#quiz-subtitle[hidden]) #main-title{font-size:clamp(1rem,2.5vw,2rem)}}:fullscreen main:has(#quiz-subtitle[hidden]) #main-title{font-size:clamp(1.25rem,4vh,2.5rem)}</style></head><body><header><button id="home" hidden>⌂ Home</button><button id="full">Fullscreen</button></header><main><h1 id="main-title">तकल मेकल</h1><p class="subtitle" id="quiz-subtitle">QUIZ COMPETITION</p><section id="menu" class="grid"><button class="r1" data-round="1">ROUND 1<small>Direct Questions</small></button><button class="r2" data-round="2">ROUND 2<small>Media Challenge</small></button><button class="r3" data-round="3">ROUND 3<small>To Be Decided</small></button><button class="r4" data-round="4">ROUND 4<small>Rapid Fire</small></button><section class="home-scores" aria-label="Live team scores"><h2>Score</h2><div id="live-scores" class="score-grid"><article class="score-card"><h3>Team A</h3><strong class="score-total">—</strong><span>POINTS</span></article><article class="score-card"><h3>Team B</h3><strong class="score-total">—</strong><span>POINTS</span></article><article class="score-card"><h3>Team C</h3><strong class="score-total">—</strong><span>POINTS</span></article><article class="score-card"><h3>Team D</h3><strong class="score-total">—</strong><span>POINTS</span></article></div></section></section><section id="view" hidden aria-live="polite"></section></main><footer>तकल मेकल • Quiz Competition</footer><script type="module" src="js/app.js?v=5.5"></script></body></html>
