<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तकल मेकल — Admin</title><link rel="stylesheet" href="css/style.css?v=2.3"></head><body class="admin"><header><a href="index.html" target="takal-projector">Main Home Page</a><button id="projector">Open Projector</button></header><main><h1>तकल मेकल</h1><p>LOCAL ADMIN CONSOLE · STEP 2</p><p id="status" role="status">Connecting to local database…</p><fieldset id="controls" disabled><section class="panel"><h2>Team management</h2><form id="teams" class="teamform"></form><button id="saveTeams">Save team names</button></section><section class="panel"><h2>Projector control</h2><div class="actions"><button data-screen="home">Home</button><button data-screen="scores">Scoreboard</button><button data-round="1">Round 1</button><button data-round="2">Round 2</button><button data-round="3">Round 3</button><button data-round="4">Round 4</button></div><p id="teamLabel">Active team</p><div id="team" class="actions" role="group" aria-labelledby="teamLabel"></div><p id="modeLabel">Timer</p><div id="mode" class="actions" role="group" aria-labelledby="modeLabel"><button type="button" data-mode="direct">Direct — 10 sec</button><button type="button" data-mode="passed">Passed — 5 sec</button><button type="button" data-mode="rapid">Rapid fire — 60 sec</button></div><div id="clock" class="timer">00:10</div><div id="timerStatus"></div><div class="actions"><button id="pass" style="background:#92400e">Pass</button><button id="start">Start / Resume</button><button id="pause">Pause / Stop</button><button id="reset">Reset timer</button></div></section><section class="panel"><h2>Backup & recovery</h2><div class="actions"><button id="export">Export JSON</button><label>Import JSON <input id="import" type="file" accept=".json,application/json"></label><button id="clear">Reset all local data</button></div></section></fieldset></main><script type="module" src="js/admin.js?v=2.4"></script></body></html>
