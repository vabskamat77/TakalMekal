<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तकल मेकल — Admin</title><link rel="stylesheet" href="css/style.css?v=2.3"><style>.admin-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.admin-tabs button[aria-pressed="true"]{outline:2px solid #facc15;background:#4338ca} [hidden]{display:none!important}
/* Admin-only colours and layout */
.admin .admin-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.admin .admin-tabs button{background:#26334f;font-weight:700}
.admin .admin-tabs button[aria-pressed="true"]{background:#4338ca;outline:2px solid #facc15;outline-offset:-2px}
.admin #projectorPanel .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.admin #projectorPanel #team{grid-template-columns:repeat(4,minmax(0,1fr))}
.admin #projectorPanel button{min-width:0;overflow-wrap:anywhere;font-weight:600;color:#fff}
.admin #projectorPanel [data-screen],.admin #projectorPanel [data-round]{background:#26334f}
.admin #projectorPanel [data-screen].selected,.admin #projectorPanel [data-round].selected{background:#4338ca}
.admin #team button,.admin #mode button{background:#26334f}
.admin #team button.selected,.admin #mode button.selected{background:#4338ca}
.admin #projectorPanel .selected{outline:2px solid #facc15;outline-offset:-2px}
.admin #pass{background:#92400e}.admin #start,.admin #saveTeams{background:#15803d}.admin #start.running,.admin #clear{background:#b91c1c}.admin #export{background:#334155}
.admin #projector{background:#0369a1}
.admin button:not(:disabled):hover{filter:brightness(1.15)}
.admin button:disabled{opacity:.5}
.admin #clock{background:#080c1c;border-radius:14px;margin-top:16px;line-height:1.2;padding:10px}
.admin #timerStatus{margin:8px 0 16px}
.admin #teamLabel,.admin #modeLabel{font-weight:700}
@media(max-width:600px){.admin #projectorPanel #team{grid-template-columns:repeat(2,minmax(0,1fr))}.admin .admin-tabs{gap:5px}.admin .admin-tabs button{padding:10px 5px;font-size:.85rem}}
</style></head><body class="admin"><header><a href="index.html" target="takal-projector">Main Home Page</a><button id="projector">Open Projector</button></header><main><h1>तकल मेकल</h1><p>LOCAL ADMIN CONSOLE · STEP 2</p><p id="status" role="status">Connecting to local database…</p><fieldset id="controls" disabled><nav class="admin-tabs" aria-label="Admin sections"><button type="button" data-tab="projectorPanel" aria-pressed="true">Projector Control</button><button type="button" data-tab="teamPanel" aria-pressed="false">Team Management</button><button type="button" data-tab="backupPanel" aria-pressed="false">Backup &amp; Recovery</button></nav><section class="panel" id="teamPanel" hidden><h2>Team management</h2><form id="teams" class="teamform"></form><button id="saveTeams">Save team names</button></section><section class="panel" id="projectorPanel"><h2>Projector control</h2><div class="actions"><button data-screen="home">Home</button><button data-screen="scores">Scoreboard</button><button data-round="1">Round 1</button><button data-round="2">Round 2</button><button data-round="3">Round 3</button><button data-round="4">Round 4</button></div><p id="teamLabel">Active team</p><div id="team" class="actions" role="group" aria-labelledby="teamLabel"></div><p id="modeLabel">Timer</p><div id="mode" class="actions" role="group" aria-labelledby="modeLabel"><button type="button" data-mode="direct">Direct — 10 sec</button><button type="button" data-mode="rapid">Rapid fire — 60 sec</button></div><div id="clock" class="timer">00:10</div><div id="timerStatus"></div><div class="actions"><button id="pass">Pass</button><button id="start">Start</button></div></section><section class="panel" id="backupPanel" hidden><h2>Backup & recovery</h2><div class="actions"><button id="export">Export JSON</button><label>Import JSON <input id="import" type="file" accept=".json,application/json"></label><button id="clear">Reset all local data</button></div></section></fieldset></main><script type="module" src="js/admin.js?v=2.9"></script></body></html>
