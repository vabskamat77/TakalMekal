<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तकल मेकल — Admin</title><link rel="stylesheet" href="css/style.css?v=2"></head><body class="admin"><header><a href="index.html" target="takal-projector">Main Home Page</a><button id="projector">Open Projector</button></header><main><h1>तकल मेकल</h1><p>LOCAL ADMIN CONSOLE · STEP 2</p><p id="status" role="status">Connecting to local database…</p><fieldset id="controls" disabled><section class="panel"><h2>Team management</h2><form id="teams" class="teamform"></form><button id="saveTeams">Save team names</button></section><section class="panel"><h2>Projector control</h2><div class="actions"><button data-screen="home">Home</button><button data-screen="scores">Scoreboard</button><button data-round="1">Round 1</button><button data-round="2">Round 2</button><button data-round="3">Round 3</button><button data-round="4">Round 4</button></div><label>Active team <select id="team"></select></label><label>Question type <select id="mode"><option value="direct">Direct — 10 sec</option><option value="passed">Passed — 5 sec</option><option value="rapid">Rapid fire — 60 sec</option></select></label><div id="clock" class="timer">00:10</div><div id="timerStatus"></div><div class="actions"><button id="start">Start / Resume</button><button id="pause">Pause / Stop</button><button id="reset">Reset timer</button></div></section><section class="panel"><h2>Backup & recovery</h2><div class="actions"><button id="export">Export JSON</button><label>Import JSON <input id="import" type="file" accept=".json,application/json"></label><button id="clear">Reset all local data</button></div></section></fieldset></main><script type="module" src="js/admin.js?v=2"></script></body></html>
